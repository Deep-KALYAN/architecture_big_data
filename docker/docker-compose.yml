services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - data-pipeline
    volumes:
      - mongo_data:/data/db

  airflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airflow
    restart: always
    depends_on:
      - mongo
      - namenode
    networks:
      - data-pipeline
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__WORKERS: 1
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    volumes:
      - ../dags:/opt/airflow/dags
      - ..:/opt/airflow/project
      - airflow_data:/opt/airflow
    ports:
      - "8080:8080"
    command: >
      bash -c "
      airflow db init &&
      airflow webserver &
      airflow scheduler
      "

  namenode:  # ◄--- Changed service name to match your code's DNS lookups
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    networks:
      - data-pipeline
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_namenode_datanode_registration_ip__hostname__check=false
      - HDFS_CONF_dfs_client_use_datanode_hostname=true
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode-data-v3:/hadoop/dfs/name

  datanode:  # ◄--- Changed service name to match your code's DNS lookups
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    networks:
      - data-pipeline
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=true
      - HDFS_CONF_dfs_client_use_datanode_hostname=true
    ports:
      - "9864:9864"
    volumes:
      - datanode-data-v3:/hadoop/dfs/data
    depends_on:
      - namenode

networks:
  data-pipeline:

volumes:
  mongo_data:
  namenode-data-v3:
  datanode-data-v3:
  airflow_data: